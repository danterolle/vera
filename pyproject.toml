[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vera-agent"
version = "0.1.0"
description = "Vulnerability Evidence and Reasoning Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2.60,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9,<1",
]
embeddings = ["sentence-transformers>=3.3,<6"]
knowledge-graph = ["kuzu==0.11.3"]

[project.scripts]
vera = "vera.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vera"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
